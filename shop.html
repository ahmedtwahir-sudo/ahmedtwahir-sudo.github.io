<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Shop — ShikaDeal"><title>Shop — ShikaDeal</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><header><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><div class="nav-links"><a href="deals.html">Deals</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="prints.html">Prints</a><a href="bench.html">Bench</a></div></nav></header><main><div class="head"><div><p class="page-count" id="page-count">— products</p><p class="eyebrow">ShikaDeal Catalogue</p><h2>Shop.</h2></div><p id="count">Loading…</p></div><div id="grid" class="grid"></div></main><footer><div class="footer-inner"><div><div class="footer-logo">SHIKADEAL</div><div class="footer-meta footer-tagline">FIND IT. CHECK IT. GET IT.</div></div><div class="footer-meta footer-right">DEALS · SHOP · GUIDES · PRINTS · BENCH<br>KILIFI, KENYA<br>© <span class="footer-year"></span></div></div></footer><script>
const grid=document.getElementById('grid'),count=document.getElementById('count'),pageCount=document.getElementById('page-count');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const wa='254795761999';
function waUrl(name,price){return `https://wa.me/${wa}?text=${encodeURIComponent(`Hi ShikaDeal, I'm interested in ${name} (KSh ${Number(price||0).toLocaleString()}). Is it still available?`)}`}
function statusLabel(status){if(status==='sold')return 'SOLD';if(status==='reserved')return 'RESERVED';if(status==='unavailable')return 'UNAVAILABLE';return 'AVAILABLE'}
function galleryHtml(images,name,id){if(!Array.isArray(images)||!images.length)return '';return `<div class="product-gallery" data-gallery="${id}">${images.map((src,i)=>`<img src="${esc(src)}" alt="${esc(name)} — image ${i+1}" loading="${i?'lazy':'eager'}" data-gallery-image="${id}" data-index="${i}" class="${i===0?'active':''}">`).join('')}${images.length>1?`<button class="gallery-arrow gallery-prev" type="button" aria-label="Previous image" data-gallery-prev="${id}">‹</button><button class="gallery-arrow gallery-next" type="button" aria-label="Next image" data-gallery-next="${id}">›</button><div class="gallery-count" data-gallery-count="${id}">1 / ${images.length}</div>`:''}</div>`}
function initGalleries(){document.querySelectorAll('.product-gallery').forEach(g=>{const imgs=[...g.querySelectorAll('img')];let idx=0;const countEl=g.querySelector('.gallery-count');const go=n=>{idx=(n+imgs.length)%imgs.length;const target=imgs[idx];g.scrollTo({left:target.offsetLeft,behavior:'smooth'});imgs.forEach((im,i)=>im.classList.toggle('active',i===idx));if(countEl)countEl.textContent=`${idx+1} / ${imgs.length}`};g.querySelector('[data-gallery-prev]')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(idx-1)});g.querySelector('[data-gallery-next]')?.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();go(idx+1)});g.addEventListener('scroll',()=>{const n=imgs.reduce((best,im,i)=>Math.abs(im.offsetLeft-g.scrollLeft)<Math.abs(imgs[best].offsetLeft-g.scrollLeft)?i:best,0);if(n!==idx){idx=n;if(countEl)countEl.textContent=`${idx+1} / ${imgs.length}`}}, {passive:true});imgs.forEach((img,i)=>img.addEventListener('click',()=>openLightbox(imgs,i)));})}
let lightbox,lightboxImg,lightboxCounter,lightboxThumbs,currentImages=[],currentIndex=0;
function buildLightbox(){if(document.getElementById('shop-lightbox')){lightbox=document.getElementById('shop-lightbox');lightboxImg=document.getElementById('shop-lightbox-img');lightboxCounter=document.getElementById('shop-lightbox-counter');lightboxThumbs=document.getElementById('shop-lightbox-thumbs');return}document.body.insertAdjacentHTML('beforeend',`<div class="lightbox" id="shop-lightbox"><div class="lightbox-topbar"><button class="lightbox-close" id="shop-lightbox-close" aria-label="Close">×</button><div class="lightbox-counter" id="shop-lightbox-counter"></div><span class="lightbox-spacer"></span></div><div class="lightbox-content"><div class="lightbox-stage"><button class="lightbox-arrow lightbox-prev" id="shop-lightbox-prev">‹</button><img id="shop-lightbox-img" alt=""><button class="lightbox-arrow lightbox-next" id="shop-lightbox-next">›</button></div><div class="lightbox-thumbs" id="shop-lightbox-thumbs"></div></div></div>`);lightbox=document.getElementById('shop-lightbox');lightboxImg=document.getElementById('shop-lightbox-img');lightboxCounter=document.getElementById('shop-lightbox-counter');lightboxThumbs=document.getElementById('shop-lightbox-thumbs');document.getElementById('shop-lightbox-close').onclick=closeLightbox;document.getElementById('shop-lightbox-prev').onclick=()=>showLightbox((currentIndex-1+currentImages.length)%currentImages.length);document.getElementById('shop-lightbox-next').onclick=()=>showLightbox((currentIndex+1)%currentImages.length);lightbox.onclick=e=>{if(e.target===lightbox)closeLightbox()};document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeLightbox();if(e.key==='ArrowLeft')showLightbox((currentIndex-1+currentImages.length)%currentImages.length);if(e.key==='ArrowRight')showLightbox((currentIndex+1)%currentImages.length)})}
function openLightbox(images,index){buildLightbox();currentImages=images;currentIndex=index;lightboxThumbs.innerHTML='';images.forEach((img,i)=>{const t=document.createElement('img');t.src=img.src;t.alt=img.alt;t.onclick=e=>{e.stopPropagation();showLightbox(i)};lightboxThumbs.appendChild(t)});lightbox.classList.add('open');document.body.style.overflow='hidden';showLightbox(index)}
function showLightbox(i){if(!currentImages.length)return;currentIndex=i;lightboxImg.src=currentImages[i].src;lightboxImg.alt=currentImages[i].alt;lightboxCounter.textContent=`Gallery (${i+1} of ${currentImages.length})`;[...lightboxThumbs.children].forEach((t,n)=>t.classList.toggle('active',n===i));const multi=currentImages.length>1;document.getElementById('shop-lightbox-prev').style.display=multi?'flex':'none';document.getElementById('shop-lightbox-next').style.display=multi?'flex':'none'}
function closeLightbox(){lightbox?.classList.remove('open');document.body.style.overflow=''}
fetch('data/products.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('Products request failed: '+r.status);return r.json()}).then(items=>{items=Array.isArray(items)?items:[];items.sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||Number(a.status==='sold')-Number(b.status==='sold'));const available=items.filter(x=>x.status!=='sold');count.textContent=`${available.length} available · ${items.length} total`;if(pageCount)pageCount.textContent=`${String(items.length).padStart(2,'0')} ${items.length===1?'product':'products'}`;grid.innerHTML=items.length?items.map((p,i)=>{const st=p.status||'available',dead=st!=='available';const cta=dead?`<span class="whatsapp-btn status-action disabled">${statusLabel(st)}</span>`:`<a class="whatsapp-btn" href="${waUrl(p.name,p.price)}" target="_blank" rel="noopener">WhatsApp ↗</a>`;return `<article class="card product-card" data-status="${esc(st)}"><span class="card-number">${String(i+1).padStart(2,'0')}</span>${galleryHtml(p.images,p.name,i)}<div class="meta">${p.condition?`<span class="condition">${esc(p.condition)}</span>`:''}<span class="status-badge ${dead?'status-unavailable':'status-available'}">${statusLabel(st)}</span></div><h3>${esc(p.name||'Unnamed product')}</h3><div class="price">KSh ${Number(p.price||0).toLocaleString()}</div><p class="take">${esc(p.description||'')}</p>${cta}</article>`}).join(''):'<div class="empty">No shop items yet.</div>';buildLightbox();initGalleries()}).catch(()=>grid.innerHTML='<div class="empty">The shop is temporarily unavailable.</div>');const fy=document.querySelector('.footer-year'); if(fy) fy.textContent=new Date().getFullYear();
</script></body></html>
