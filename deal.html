<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deal — ShikaDeal</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><div class="nav-links"><a href="deals.html">Deals</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="prints.html">Prints</a><a href="bench.html">Bench</a></div></nav></header><main class="wrap" id="app"><div class="error">Loading deal…</div></main><script>
const q=new URLSearchParams(location.search),slug=q.get('slug'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=(v,c='KSh')=>v===null||v===undefined||v===''?'—':`${c} ${Number(v).toLocaleString()}`;
const fmt=d=>d?new Date(d).toLocaleString('en-GB'):'—';
function dealStatus(d){if(d.status==='expired')return 'expired';if(['sold-out','sold','reserved','unavailable'].includes(d.status))return d.status;if(d.expiresAt&&new Date(d.expiresAt)<new Date())return 'expired';if(d.ebay&&d.ebay.endDate&&new Date(d.ebay.endDate)<new Date())return 'expired';return d.status||'active'}
function statusLabel(s){return s==='sold-out'||s==='sold'?'SOLD':s.replace(/-/g,' ').toUpperCase()}
function disabledAction(label,status,desc=''){return `<span class="action disabled-action"><strong>${label}</strong>${desc?`<p>${desc}</p>`:''}</span>`}
fetch('data/deals.json?v='+Date.now()).then(r=>r.json()).then(ds=>{const d=ds.find(x=>x.slug===slug);if(!d)throw Error('Deal not found');const st=dealStatus(d),inactive=['expired','sold-out','sold','reserved','unavailable'].includes(st);document.title=d.title+' — ShikaDeal';const statusNotice=inactive?`<div class="expired"><strong>${statusLabel(st)}</strong><br>${st==='expired'?'This listing is no longer active. The original deal button has been disabled.':'This item is no longer available. Item-specific purchase and enquiry actions have been disabled.'}</div>`:'';const actions=inactive?`${disabledAction(statusLabel(st),'', 'This deal is no longer available.')} ${d.guideUrl?disabledAction('GUIDE UNAVAILABLE','', 'The buying guide is retained for reference, but this deal cannot be purchased.') : ''}`:`${d.assistanceUrl?`<a class="action primary" href="${esc(d.assistanceUrl)}"><strong>Let ShikaDeal help</strong><p>Buying, shipping or importing assistance.</p></a>`:''}${d.guideUrl?`<a class="action secondary" href="${esc(d.guideUrl)}"><strong>Do it yourself</strong><p>Learn the process with the relevant ShikaDeal guide.</p></a>`:''}${d.sourceUrl?`<a class="action source" href="${esc(d.sourceUrl)}" target="_blank" rel="noopener"><strong>Original deal</strong><p>View the original listing or source.</p></a>`:''}`;app.innerHTML=`<a class="back" href="deals.html">← Back to Deal Desk</a><div class="kicker"><span>${d.type==='international'?'🌍 INTERNATIONAL FIND':'🇰🇪 KENYA DEAL'} · ${esc(d.category||'Deal')}</span></div><section class="deal-detail-hero"><div><h1>${esc(d.title)}</h1><p class="lede">${esc(d.summary||d.whyNoticed||'A ShikaDeal find checked before publication.')}</p><div class="checked">LAST CHECKED: ${fmt(d.lastChecked)} · STATUS: ${statusLabel(st)}</div></div>${d.image?`<img class="deal-detail-image" src="${esc(d.image)}" alt="${esc(d.title)}">`:''}</section>${statusNotice}<section class="numbers"><div class="number"><span class="label">Listing price</span><span class="value">${money(d.price,d.currency)}</span></div><div class="number"><span class="label">Shipping</span><span class="value">${money(d.shipping,d.currency)}</span></div><div class="number"><span class="label">Condition</span><span class="value">${esc(d.condition||'—')}</span></div><div class="number"><span class="label">Seller</span><span class="value">${esc(d.seller||'—')}</span></div><div class="number"><span class="label">Returns / warranty</span><span class="value">${esc(d.returns||'—')}</span></div><div class="number"><span class="label">Expires</span><span class="value">${fmt(d.expiresAt)}</span></div></section><section class="section"><h2>Why we noticed it</h2><p class="copy">${esc(d.whyNoticed||'—')}</p></section><section class="section"><h2>What we checked</h2><div class="checks">${(d.checked&&d.checked.length?d.checked:['Seller','Condition','Listing','Price','Shipping']).map(x=>`<div class="check">✓ ${esc(x)}</div>`).join('')}</div></section><section class="section"><h2>The catch</h2><div class="catch">${esc(d.theCatch||'No additional catch recorded.')}</div></section><section class="section"><h2>Our take</h2><p class="copy">${esc(d.ourTake||'—')}</p></section><section class="section"><h2>${inactive?'Deal status':'How do you want to get it?'}</h2><div class="actions">${actions}</div></section><a class="back deal-back-bottom" href="deals.html">← Back to Deal Desk</a>`}).catch(e=>{app.innerHTML='<div class="error">Deal not found.<br><br><a class="btn" href="deals.html">← Return to the Deal Desk</a></div>'});
</script><footer><div class="footer-inner"><div><div class="footer-logo">SHIKADEAL</div><div class="footer-meta footer-tagline">FIND IT. CHECK IT. GET IT.</div></div><div class="footer-meta footer-right">DEALS · SHOP · GUIDES · PRINTS · BENCH<br>KILIFI, KENYA<br>© <span class="footer-year"></span></div></div></footer><script>document.querySelector('.footer-year')?.replaceWith(String(new Date().getFullYear()));</script></body></html>
