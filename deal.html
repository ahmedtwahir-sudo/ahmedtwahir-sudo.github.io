<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Deal — ShikaDeal</title><link rel="icon" href="favicon.ico"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#11110f;--paper:#f4f0e7;--paper2:#e8e1d4;--acid:#d7ff3f;--orange:#ff5a36;--muted:#77736a;--line:rgba(17,17,15,.16)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Space Grotesk',sans-serif}a{color:inherit}.mono,.eyebrow,.label{font-family:'DM Mono',monospace}.nav{max-width:1180px;margin:auto;padding:16px 24px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:800 25px Syne;text-decoration:none}.nav a:last-child{font:11px 'DM Mono';text-transform:uppercase}.wrap{max-width:1100px;margin:auto;padding:70px 24px 100px}.back{font:11px 'DM Mono';text-transform:uppercase}.kicker{margin-top:45px}.kicker span{border:1px solid var(--ink);padding:6px 8px;font:10px 'DM Mono';text-transform:uppercase}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:45px;align-items:start;margin-top:22px}.hero h1{font:800 clamp(48px,8vw,100px)/.86 Syne;letter-spacing:-.07em;margin:0}.lede{font-size:19px;line-height:1.55}.hero-image{width:100%;max-height:500px;object-fit:cover;border:1px solid var(--ink)}.checked{margin-top:25px;font:10px 'DM Mono';text-transform:uppercase}.numbers{margin-top:70px;border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(2,1fr)}.number{padding:22px 18px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}.label{font-size:10px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:9px}.value{font:20px 'DM Mono'}.section{margin-top:65px}.section h2{font:700 43px Syne;letter-spacing:-.05em;margin:0 0 18px}.copy{line-height:1.65;max-width:750px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.check{padding:13px;background:var(--paper2);border:1px solid var(--line);font:12px 'DM Mono'}.catch{padding:25px;background:var(--ink);color:var(--paper);font-size:18px;line-height:1.55}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.action{border:1px solid var(--ink);padding:20px;text-decoration:none}.action strong{display:block;font:700 24px Syne;margin-bottom:8px}.action p{font-size:13px;line-height:1.4}.action.primary{background:var(--acid)}.expired{padding:25px;background:#ddd8ce;border:1px solid var(--ink);margin-top:30px}.error{padding:50px 0;font-size:20px}@media(max-width:800px){.hero,.numbers,.checks,.actions{grid-template-columns:1fr}.hero-image{order:-1}.number{border-right:0}}
</style></head><body><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><a href="deals.html">← Deal Desk</a></nav><main class="wrap" id="app"><div class="error">Loading deal…</div></main><script>
const q=new URLSearchParams(location.search),slug=q.get('slug'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=(v,c='KSh')=>v===null||v===undefined||v===''?'—':`${c} ${Number(v).toLocaleString()}`;const fmt=d=>d?new Date(d).toLocaleString('en-GB'):'—';fetch('data/deals.json?v='+Date.now()).then(r=>r.json()).then(ds=>{const d=ds.find(x=>x.slug===slug);if(!d)throw Error('Deal not found');const expired=d.status==='expired'||(d.expiresAt&&new Date(d.expiresAt)<new Date());document.title=d.title+' — ShikaDeal';app.innerHTML=`<a class="back" href="deals.html">← Back to Deal Desk</a><div class="kicker"><span>${d.type==='international'?'🌍 INTERNATIONAL FIND':'🇰🇪 KENYA DEAL'} · ${esc(d.category||'Deal')}</span></div><section class="hero"><div><h1>${esc(d.title)}</h1><p class="lede">${esc(d.summary||d.whyNoticed||'A ShikaDeal find checked before publication.')}</p><div class="checked">LAST CHECKED: ${fmt(d.lastChecked)} · STATUS: ${esc(d.status||'active')}</div></div>${d.image?`<img class="hero-image" src="${esc(d.image)}" alt="${esc(d.title)}">`:''}</section>${expired?`<div class="expired"><strong>DEAL EXPIRED</strong><br>This listing is no longer active. We keep expired finds as part of the Deal Desk record.</div>`:''}<section class="numbers"><div class="number"><span class="label">Listing price</span><span class="value">${money(d.price,d.currency)}</span></div><div class="number"><span class="label">Shipping</span><span class="value">${money(d.shipping,d.currency)}</span></div><div class="number"><span class="label">Estimated import</span><span class="value">${money(d.importCost,'KSh')}</span></div><div class="number"><span class="label">Estimated landed cost</span><span class="value">${money(d.landedCost,'KSh')}</span></div><div class="number"><span class="label">Condition</span><span class="value">${esc(d.condition||'—')}</span></div><div class="number"><span class="label">Seller</span><span class="value">${esc(d.seller||'—')}</span></div><div class="number"><span class="label">Returns / warranty</span><span class="value">${esc(d.returns||'—')}</span></div><div class="number"><span class="label">Expires</span><span class="value">${fmt(d.expiresAt)}</span></div></section><section class="section"><h2>Why we noticed it</h2><p class="copy">${esc(d.whyNoticed||'—')}</p></section><section class="section"><h2>What we checked</h2><div class="checks">${(d.checked&&d.checked.length?d.checked:['Seller','Condition','Listing','Price','Shipping']).map(x=>`<div class="check">✓ ${esc(x)}</div>`).join('')}</div></section><section class="section"><h2>The catch</h2><div class="catch">${esc(d.theCatch||'No additional catch recorded.')}</div></section><section class="section"><h2>Our take</h2><p class="copy">${esc(d.ourTake||'—')}</p></section><section class="section"><h2>How do you want to get it?</h2><div class="actions">${d.assistanceUrl?`<a class="action primary" href="${esc(d.assistanceUrl)}"><strong>Let ShikaDeal help</strong><p>Buying, shipping or importing assistance.</p></a>`:''}${d.guideUrl?`<a class="action" href="${esc(d.guideUrl)}"><strong>Do it yourself</strong><p>Learn the process with the relevant ShikaDeal guide.</p></a>`:''}${d.sourceUrl?`<a class="action" href="${esc(d.sourceUrl)}" target="_blank" rel="noopener"><strong>Original deal</strong><p>View the original listing or source.</p></a>`:''}</div></section>`}).catch(e=>{app.innerHTML='<div class="error">Deal not found.<br><br><a href="deals.html">← Return to the Deal Desk</a></div>'});
</script></body></html>
