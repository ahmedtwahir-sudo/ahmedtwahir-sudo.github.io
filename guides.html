<link rel="stylesheet" href="css/style.css"></head><body><header><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><div class="nav-links"><a href="deals.html">Deals</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="prints.html">Prints</a><a href="bench.html">Bench</a></div></nav></header><main><div class="head"><div><p class="page-count" id="page-count">— guides</p><p class="eyebrow">ShikaDeal Catalogue</p><h2>Guides.</h2></div><p id="count">Loading…</p></div><div id="grid" class="grid"></div></main><footer><div class="footer-inner"><div><div class="footer-logo">SHIKADEAL</div><div class="footer-meta footer-tagline">FIND IT. CHECK IT. GET IT.</div></div><div class="footer-meta footer-right">DEALS · SHOP · GUIDES · PRINTS · BENCH<br>KILIFI, KENYA<br>© <span class="footer-year"></span></div></div></footer><script>
const grid=document.getElementById('grid'),count=document.getElementById('count'),pageCount=document.getElementById('page-count');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('data/guides.json?v='+Date.now()).then(r=>r.json()).then(items=>{items=(Array.isArray(items)?items:[]).filter(x=>x.status==='published').sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||new Date(b.updatedAt||0)-new Date(a.updatedAt||0));count.textContent=`${items.length} published`;if(pageCount)pageCount.textContent=`${String(items.length).padStart(2,'0')} ${items.length===1?'guide':'guides'}`;grid.innerHTML=items.length?items.map((g,i)=>`<article class="card guide"><span class="card-number">${String(i+1).padStart(2,'0')}</span><div class="meta"><span>${esc(g.featured?'Featured':'Guide')}</span><span>${esc(g.type||'PDF')}</span></div>${g.coverImage?`<a class="guide-cover-link" href="${esc(g.previewUrl||g.url||'#')}" target="_blank" rel="noopener"><img class="guide-cover" src="${esc(g.coverImage)}" alt="${esc(g.title)}" loading="lazy"></a>`:''}<h3><a class="card-title-link" href="${esc(g.previewUrl||g.url||'#')}" target="_blank" rel="noopener">${esc(g.title||'Untitled guide')}</a></h3><p>${esc(g.description||'')}</p><div class="guide-actions-row"><strong class="guide-price">KSh ${Number(g.price||0).toLocaleString()}</strong><div class="guide-actions">${g.previewUrl?`<a class="guide-preview-btn" href="${esc(g.previewUrl)}" target="_blank" rel="noopener">FREE PREVIEW ↗</a>`:''}${g.url?`<a class="guide-buy-btn" href="${esc(g.url)}" target="_blank" rel="noopener">GET FULL GUIDE ↗</a>`:''}</div></div></article>`).join(''):'<div class="empty">No published guides yet.</div>'}).catch(()=>grid.innerHTML='<div class="empty">The guide catalogue is temporarily unavailable.</div>');
document.querySelector('.footer-year')?.replaceWith(String(new Date().getFullYear()));
</script></body></html>
