<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="3D Prints — ShikaDeal"><title>3D Prints — ShikaDeal</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/style.css"></head><body><header><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><div class="nav-links"><a href="deals.html">Deals</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="prints.html">Prints</a><a href="bench.html">Bench</a></div></nav></header><main><div class="head"><div><p class="page-count" id="page-count">— prints</p><p class="eyebrow">ShikaDeal Catalogue</p><h2>3D Prints.</h2></div><p id="count">Loading…</p></div><div id="grid" class="grid"></div></main><footer><div class="footer-inner"><div><div class="footer-logo">SHIKADEAL</div><div class="footer-meta footer-tagline">FIND IT. CHECK IT. GET IT.</div></div><div class="footer-meta footer-right">DEALS · SHOP · GUIDES · PRINTS · BENCH<br>KILIFI, KENYA<br>© <span class="footer-year"></span></div></div></footer><script>
const grid=document.getElementById('grid'),count=document.getElementById('count'),pageCount=document.getElementById('page-count');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const wa='254795761999';function waUrl(name,price){return `https://wa.me/${wa}?text=${encodeURIComponent(`Hi ShikaDeal, I'm interested in ${name} (KSh ${Number(price||0).toLocaleString()}). Is it still available?`)}`}fetch('data/prints.json?v='+Date.now()).then(r=>r.json()).then(items=>{items=(Array.isArray(items)?items:[]).filter(x=>x.status!=='hidden').sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||new Date(b.updatedAt||0)-new Date(a.updatedAt||0));count.textContent=`${items.length} prints`;if(pageCount)pageCount.textContent=`${String(items.length).padStart(2,'0')} ${items.length===1?'print':'prints'}`;grid.innerHTML=items.length?items.map((p,i)=>`<article class="card print"><span class="card-number">${String(i+1).padStart(2,'0')}</span>${p.images?.[0]?`<img class="card-image" src="${esc(p.images[0])}" alt="${esc(p.name)}" loading="lazy">`:''}<div class="meta"><span class="status-badge ${p.status==='available'?'status-available':'status-unavailable'}">${esc((p.status||'available').replace(/-/g,' ').toUpperCase())}</span><span class="condition">${esc(p.category||'3D PRINT')}</span></div><h3>${esc(p.name||'Untitled print')}</h3><p>${esc(p.description||'')}</p><div class="print-card-footer"><strong class="print-price">KSh ${Number(p.price||0).toLocaleString()}</strong>${p.status==='available'?`<a class="whatsapp-btn" href="${waUrl(p.name,p.price)}" target="_blank" rel="noopener">WhatsApp ↗</a>`:`<span class="whatsapp-btn status-action disabled">${esc(p.status||'Unavailable').toUpperCase()}</span>`}</div></article>`).join(''):'<div class="empty">No prints listed yet.</div>'}).catch(()=>grid.innerHTML='<div class="empty">The print catalogue is temporarily unavailable.</div>');
document.querySelector('.footer-year')?.replaceWith(String(new Date().getFullYear()));
</script></body></html>
