<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>From the Bench — ShikaDeal</title><link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body><header><nav class="nav"><a class="logo" href="index.html">SHIKADEAL</a><div class="nav-links"><a href="deals.html">Deals</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="prints.html">Prints</a><a href="bench.html">Bench</a></div></nav></header><main><div class="page-count" id="count">— articles</div><div id="grid" class="grid"></div></main><footer><div class="footer-inner"><div><div class="footer-logo">SHIKADEAL</div><div class="footer-meta footer-tagline">FIND IT. CHECK IT. GET IT.</div></div><div class="footer-meta footer-right">DEALS · SHOP · GUIDES · PRINTS · BENCH<br>KILIFI, KENYA<br>© <span class="footer-year"></span></div></div></footer><script>
const grid=document.getElementById('grid'),count=document.getElementById('count');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('data/blog.json?v='+Date.now()).then(r=>r.json()).then(items=>{items=(Array.isArray(items)?items:[]).filter(x=>x.status==='published').sort((a,b)=>Number(!!b.featured)-Number(!!a.featured)||new Date(b.date||0)-new Date(a.date||0));count.textContent=`${String(items.length).padStart(2,'0')} ${items.length===1?'article':'articles'}`;grid.innerHTML=items.length?items.map((p,i)=>{const u=`blog.html?id=${encodeURIComponent(p.id||'')}`;return `<article class="card bench-card"><span class="card-number">${String(i+1).padStart(2,'0')}</span>${p.coverImage?`<a class="card-image-link" href="${u}"><img class="bench-card-image" src="${esc(p.coverImage)}" alt="${esc(p.title)}" loading="lazy"></a>`:''}<span class="date">${esc(p.featured?'FEATURED · ':'')}${p.date?new Date(p.date).toLocaleDateString('en-KE',{day:'numeric',month:'short',year:'numeric'}):''}</span><h2><a class="card-title-link" href="${u}">${esc(p.title||'Untitled post')}</a></h2><p>${esc(p.excerpt||'')}</p><a class="read-btn" href="${u}">READ THE FULL ARTICLE →</a></article>`}).join(''):'<div class="empty">No published articles yet.</div>'}).catch(()=>grid.innerHTML='<div class="empty">The Bench is temporarily unavailable.</div>');
document.querySelector('.footer-year')?.replaceWith(String(new Date().getFullYear()));
</script></body></html>
